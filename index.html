<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satsang Prep">
<meta name="theme-color" content="#7a1f33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Satsang Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, devotional, disciplined: a study companion, not a game.
   IDEA: a mandir study shelf: four textbooks as spines that fill as you read.
   PICTURE: the shelf of four spines in the maroon band, filling with saffron.
   COLOUR and TYPE: maroon field, saffron accent, white page; Mukta throughout.
   LAYOUT: one column for phones; tabs under the band; reader is full screen. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#160e11);--ink:light-dark(#24161a,#f2e8ea);--mute:light-dark(#6f5a60,#b9a5aa);
--band:light-dark(#7a1f33,#4a1321);--bandink:#fff4ee;--sa:light-dark(#e57a12,#ff9b3d);--sa2:light-dark(#fff1e3,#3a2214);
--panel:light-dark(#f7eff1,#22161a);--line:light-dark(#e8dadd,#3a2a2f);--ok:light-dark(#2f6b3a,#7fcf8d);--warn:light-dark(#a3301b,#ff8a72)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Mukta,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sa);outline-offset:2px}
.band{background:var(--band);color:var(--bandink);padding:calc(22px + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 18px max(5vw,16px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--band);z-index:30}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(26px,6vw,38px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.sub{opacity:.85;margin:6px 0 0;font-size:16px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px;align-items:end}
.spine{position:relative;height:132px;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);overflow:hidden;box-shadow:inset -6px 0 0 rgba(0,0,0,.15)}
.spine .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffb15c,var(--sa));transition:height .6s}
.spine .nm{position:absolute;inset:8px 6px auto;font-size:13px;overflow-wrap:anywhere;hyphens:auto;font-weight:600;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.spine .pc{position:absolute;bottom:6px;left:6px;font-size:13px;font-weight:800}
.spine:nth-child(2){height:110px}.spine:nth-child(3){height:120px}.spine:nth-child(4){height:126px}
.count{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;opacity:.92}
.count b{font-size:22px;display:block;line-height:1}
nav{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex}
nav button{flex:1;border:0;background:none;padding:12px 4px;min-height:48px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--sa)}
main{padding:18px max(5vw,16px) calc(80px + env(safe-area-inset-bottom))}
section[hidden]{display:none}
h2{font-size:24px;line-height:1.1;margin:22px 0 10px}
h3{font-size:17px;margin:0}
.note{font-size:14px;color:var(--mute)}
.banner{border-radius:12px;padding:12px 14px;background:var(--sa2);margin-bottom:14px}
.banner.bad{background:light-dark(#fde8e3,#3b1a14);color:var(--warn)}
.banner.good{background:light-dark(#e8f4ea,#16281a);color:var(--ok)}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--bg)}
.task.done{opacity:.6}
.task .meta{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--panel);border-radius:99px;padding:1px 9px;white-space:nowrap}
.task p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn.pri{background:var(--sa);border-color:var(--sa);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.week{margin:18px 0}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.day .d{font-weight:800;line-height:1.1;font-size:14px}
.day .d small{display:block;font-weight:400;color:var(--mute)}
.day.today .d{color:var(--sa)}
.day.off .d{color:var(--mute)}
.li{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:2px 0}
.li input{width:20px;height:20px;margin-top:3px;accent-color:var(--sa);flex:none}
.li.x span{text-decoration:line-through;color:var(--mute)}
.ph{background:var(--band);color:var(--bandink);border-radius:10px;padding:8px 12px;margin-top:20px;font-weight:600}
.book{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.cov{height:70px;border-radius:4px;background:var(--band);position:relative;overflow:hidden}
.cov i{position:absolute;bottom:0;left:0;right:0;background:var(--sa)}
.bm{font-size:14px;margin:4px 0;display:flex;gap:6px;align-items:center}
.bm button{border:0;background:none;color:var(--sa);font-weight:600;padding:4px 0;text-align:left}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;min-height:44px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:80px}
.card{border-radius:16px;background:var(--panel);padding:20px;margin:12px 0;min-height:170px}
.card q{font-size:20px;line-height:1.35;display:block}
.ans{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.set{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.set input[type=date]{width:auto}
.tog{width:22px;height:22px;accent-color:var(--sa)}
/* reader */
#reader{position:fixed;inset:0;z-index:20;background:var(--rbg);color:var(--rink);display:flex;flex-direction:column;
 --rbg:light-dark(#fbf8f2,#141012);--rink:light-dark(#2b2420,#ece3dc);--rmute:light-dark(#857467,#a8988e);--rline:light-dark(#e8dfd2,#30262a);--rpanel:light-dark(#f3ece1,#1e1719);--fs:19px}
#reader[data-th=paper]{color-scheme:light;--rbg:#fbf8f2;--rink:#2b2420;--rmute:#857467;--rline:#e8dfd2;--rpanel:#f3ece1}
#reader[data-th=sepia]{color-scheme:light;--rbg:#f3e9d3;--rink:#3a2c20;--rmute:#86705a;--rline:#e0d2b6;--rpanel:#eadcc0}
#reader[data-th=night]{color-scheme:dark;--rbg:#141012;--rink:#ece3dc;--rmute:#a8988e;--rline:#30262a;--rpanel:#1e1719}
#reader[hidden]{display:none}
.rbar{display:flex;align-items:center;gap:2px;padding:calc(4px + env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) 4px max(6px,env(safe-area-inset-left));background:var(--band);color:var(--bandink)}
.rbar button{background:none;border:0;color:inherit;min-width:44px;min-height:44px;font-size:18px;border-radius:10px}
.rbar button[aria-pressed=true]{background:rgba(255,255,255,.16)}
.rbar .t{flex:1;font-size:13px;line-height:1.25;overflow:hidden;padding:0 4px}
.rbar .t b,.rbar .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .t span{opacity:.85}
#rprog{height:3px;background:rgba(229,122,18,.18)}#rprog i{display:block;height:100%;width:0;background:var(--sa);transition:width .3s}
.rtools{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--rline);background:var(--rbg);overflow-x:auto;scrollbar-width:none}
.seg{display:inline-flex;border:1px solid var(--rline);border-radius:99px;padding:2px;flex:none}
.seg button{border:0;background:none;border-radius:99px;min-height:32px;padding:0 12px;font-size:14px;font-weight:600;color:var(--rmute)}
.seg button[aria-pressed=true]{background:var(--rink);color:var(--rbg)}
.seg button:disabled{opacity:.35}
.chip{border:1px solid var(--rline);background:none;border-radius:99px;min-height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--rink);flex:none}
.chip[aria-pressed=true]{border-color:var(--sa);background:rgba(229,122,18,.14)}
.rtools .sp{flex:1}
#rbody{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
@media(min-width:900px){#rbody{flex-direction:row}}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:light-dark(#e9e1e3,#0c0809)}
#pages[hidden],#flow[hidden],#cmp[hidden]{display:none}
.pg{margin:0 auto 8px;background:#fff;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pg canvas{width:100%;height:100%;display:block}
.pg .n{position:absolute;right:6px;bottom:4px;font-size:11px;color:#999}
#flow{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;font-family:Literata,Georgia,serif;font-size:var(--fs);line-height:1.7;scroll-padding-top:12px}
#flow .in{max-width:36rem;margin:0 auto;padding:18px 22px calc(160px + env(safe-area-inset-bottom))}
.sec{content-visibility:auto;contain-intrinsic-size:auto 1400px}
.sec+.sec{margin-top:2.6em;padding-top:1.6em;border-top:1px solid var(--rline)}
#flow h2.st{font-size:1.45em;line-height:1.2;margin:0 0 .9em;font-weight:600;text-wrap:balance}
#flow h2.st .lab{display:block;font:600 12px/1.4 Mukta,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--sa);margin-bottom:.4em}
#flow .h{font-size:1.15em;margin:1.4em 0 .6em;font-weight:600;line-height:1.3}
#flow .h4{font:700 13px/1.4 Mukta,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--rmute);margin:1.8em 0 .5em}
#flow .p{margin:0 0 .45em;text-indent:1.3em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
#flow h2+.p,#flow .h+.p,#flow .h4+.p,#flow .orn+.p,#flow .cap+.p{text-indent:0}
#flow .p.li{text-indent:0;padding-left:1.3em;position:relative;margin:.5em 0}
#flow .p.li::before{content:"";position:absolute;left:.3em;top:.72em;width:.38em;height:.38em;border-radius:50%;background:var(--sa)}
#flow .v{white-space:pre-line;margin:.9em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--rline)}
#flow .gl{margin:0 0 .5em;padding-left:1.2em;text-indent:-1.2em;font-size:.94em}
#flow .gl em:first-child{font-weight:600}
#flow .fn{font-size:.8em;color:var(--rmute);margin:.6em 0;border-top:1px solid var(--rline);padding-top:.4em}
#flow .cap{margin:1em 0;padding:.55em .8em;border-left:3px solid var(--sa);background:var(--rpanel);border-radius:0 10px 10px 0;font:14px/1.45 Mukta,system-ui,sans-serif;color:var(--rmute)}
#flow .cap button{display:block;border:0;background:none;padding:0 0 2px;color:var(--sa);font:600 12px Mukta,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
#flow .orn{text-align:center;color:var(--rmute);letter-spacing:.8em;margin:1.2em 0;font-size:.8em}
#flow em.g{text-decoration:underline dotted;text-decoration-color:var(--rmute);text-underline-offset:.2em;cursor:pointer}
.pgm{user-select:none;-webkit-user-select:none}
.pgm::before{content:attr(data-n);font:600 10.5px/1 Mukta,system-ui,sans-serif;color:var(--rmute);border:1px solid var(--rline);border-radius:99px;padding:1px 6px;margin:0 .3em;vertical-align:.25em;text-indent:0;display:inline-block}
.hl{color:inherit;border-radius:.22em;padding:.04em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer}
.h-fact{background:rgba(255,206,0,.42)}.h-quote{background:rgba(255,99,146,.28)}.h-why{background:rgba(70,150,255,.27)}.h-lesson{background:rgba(52,190,120,.30)}
.h-event{background:none;text-decoration:underline;text-decoration-color:#b4233f;text-decoration-thickness:.14em;text-underline-offset:.24em}
.h-word{background:none;border:1.7px solid #e57a12;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:0 .2em;margin:0 -.05em}
.h-note{background:none;text-decoration:underline dotted;text-decoration-color:var(--rmute);text-decoration-thickness:.12em;text-underline-offset:.24em}
.h-note:last-of-type::after{content:"✎";font-size:.7em;vertical-align:.5em;color:var(--sa)}
#reader[data-th=night] .h-fact{background:rgba(255,206,0,.30)}#reader[data-th=night] .h-quote{background:rgba(255,99,146,.30)}#reader[data-th=night] .h-why{background:rgba(70,150,255,.32)}#reader[data-th=night] .h-lesson{background:rgba(52,190,120,.30)}#reader[data-th=night] .h-event{text-decoration-color:#ff7d93}
.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px rgba(229,122,18,.55)}100%{box-shadow:0 0 0 4px rgba(229,122,18,0)}}
.spk{background:rgba(229,122,18,.16);box-shadow:0 0 0 2px rgba(229,122,18,.16);border-radius:.2em}
.prep{max-width:26rem;margin:15vh auto 0;padding:0 24px;font-family:Mukta,system-ui,sans-serif;text-align:center}
.prep .bar{height:6px;border-radius:9px;background:var(--rline);overflow:hidden;margin-top:14px}.prep .bar i{display:block;height:100%;width:0;background:var(--sa);transition:width .2s}
#cmp{flex:0 0 50%;overflow:auto;border-top:2px solid var(--rline);background:light-dark(#e9e1e3,#0c0809);font-family:Mukta,system-ui,sans-serif}
@media(min-width:900px){#cmp{flex:0 0 46%;border-top:0;border-left:2px solid var(--rline)}}
#cmp .ch{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--rbg);border-bottom:1px solid var(--rline);font-size:14px}
#cmp .ch .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmp .ch button{min-height:36px}
#cmp .cp{margin:8px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);position:relative}
#cmp .cp canvas{display:block;width:100%}
#cmp .cp span{position:absolute;right:6px;bottom:3px;font-size:11px;color:#888}
#cmp .msg{padding:18px;font-size:15px}
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 8px calc(10px + env(safe-area-inset-bottom));z-index:3}
.dock>div{pointer-events:auto;background:var(--rbg);color:var(--rink);border:1px solid var(--rline);border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:Mukta,system-ui,sans-serif}
.dock[hidden]{display:none}
#selbar>div{display:flex;gap:2px;padding:6px}
#selbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;padding:4px 2px;font-size:11px;font-weight:600;color:var(--rink);border-radius:12px}
#selbar i,.sw{width:26px;height:26px;border-radius:50%;display:block;font-style:normal;font-size:14px;line-height:26px;text-align:center}
.sw-fact{background:rgba(255,206,0,.75)}.sw-quote{background:rgba(255,99,146,.6)}.sw-why{background:rgba(70,150,255,.55)}.sw-lesson{background:rgba(52,190,120,.6)}
.sw-event{box-shadow:inset 0 -4px 0 #b4233f;border-radius:6px!important}.sw-word{border:2px solid #e57a12}.sw-note{border:1.5px dashed var(--rmute)}
#player>div{display:flex;align-items:center;gap:4px;padding:6px 8px}
#player button{border:0;background:none;min-width:44px;min-height:44px;border-radius:12px;font-size:18px;color:var(--rink)}
#player .pp{background:var(--sa);color:#fff;border-radius:50%;width:48px;height:48px}
#player .rt{font-size:14px;font-weight:700;min-width:52px}
#player .who{font-size:12px;color:var(--rmute);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--rink);color:var(--rbg);padding:8px 14px;border-radius:12px;font:14px/1.35 Mukta,system-ui,sans-serif;max-width:88%;z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
#toast button{border:0;background:none;color:var(--sa);font-weight:700;margin-left:8px}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--rbg);color:var(--rink);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 28px rgba(0,0,0,.25);z-index:5;font-family:Mukta,system-ui,sans-serif}
@media(min-width:700px){#sheet{left:50%;right:auto;width:620px;transform:translateX(-50%)}}
#sheet[hidden]{display:none}
#sheet input,#sheet textarea,#sheet select{background:var(--rbg);color:var(--rink);border-color:var(--rline)}
#sheet .btn{background:var(--rpanel);border-color:var(--rline);color:var(--rink)}#sheet .btn.pri{background:var(--sa);border-color:var(--sa);color:#fff}
.shh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.shh h3{flex:1;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.toc button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rline);background:none;padding:10px 2px;min-height:44px;color:var(--rink);font-size:15px}
.toc button.on{color:var(--sa);font-weight:700}
.toc small{color:var(--rmute);white-space:nowrap}
.toc .sub{padding-left:14px}
.nb{border:0;border-left:4px solid var(--rline);background:var(--rpanel);border-radius:0 12px 12px 0;padding:8px 10px;margin:8px 0;width:100%;text-align:left;color:var(--rink);display:block;font-size:15px;line-height:1.45}
.nb small{display:block;color:var(--rmute);font-size:12px;margin-top:3px}
.nb.k-fact{border-color:#e8b800}.nb.k-quote{border-color:#f0517f}.nb.k-why{border-color:#3d8bf0}.nb.k-lesson{border-color:#2fae6e}.nb.k-event{border-color:#b4233f}.nb.k-word{border-color:#e57a12}.nb.k-note{border-color:var(--rmute)}
.nbq{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:6px 0 4px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kinds button{display:flex;align-items:center;gap:6px;border:1px solid var(--rline);background:none;border-radius:99px;padding:4px 10px 4px 5px;min-height:36px;font-size:14px;color:var(--rink)}
.kinds button[aria-pressed=true]{border-color:var(--rink);font-weight:700}
.kinds .sw{width:20px;height:20px}
.recall{font-family:Literata,Georgia,serif;font-size:18px;line-height:1.6;background:var(--rpanel);border-radius:14px;padding:16px;margin:10px 0;min-height:120px}
.recall .gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--sa)}
.recall .ans{background:rgba(229,122,18,.18);border-radius:.2em}
.gpop{font-size:15px;line-height:1.5}
.gpop dfn{font-family:Literata,Georgia,serif;font-style:italic;font-size:20px;font-weight:600;display:block}
input[type=range]{width:100%;accent-color:var(--sa)}
@media(prefers-reduced-motion:reduce){.spine .fill{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
<h1>Satsang Parichay prep</h1>
<p class="sub" id="sub">Your plan, your books and your quote cards in one place.</p>
<div class="shelf" id="shelf" aria-label="Reading progress by book"></div>
<div class="count" id="count"></div>
</div></header>
<nav><div class="wrap" role="tablist">

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------- state ---------- */
const DEF={v:1,upd:0,start:"2026-11-21",exam:"2027-02-28",sundays:false,

 done:{},last:{},bm:{},adj:{},cards:[],lang:"en",hl:{},rpos:{},rset:{fs:19,th:"auto",rate:1}};

try{const l=JSON.parse(localStorage.getItem("spp-state")||"null");if(l&&l.v===1)S=Object.assign(S,l)}catch(e){}
const fixExam=o=>{if(o.exam==="2027-03-07"&&!o.examSet)o.exam="2027-02-28";return o};fixExam(S);
let db=null,ref=null,saveT=null,writing=false,again=false;
function save(){S.upd=Date.now();try{localStorage.setItem("spp-state",JSON.stringify(S))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(push,900)}
async function push(){if(!ref)return;if(writing){again=true;return}writing=true;
 try{await ref.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&e.code==="invalid_argument")ref=null}
 writing=false;if(again){again=false;push()}}

/* ---------- schedule ---------- */
const P12=[...DATA.p1,...DATA.p2],ALL=[...P12,...DATA.p3,...DATA.mocks];
const byId=Object.fromEntries(ALL.map(t=>[t.id,t]));
function slots(from){const out=[],ex=pd(S.exam),off=new Set(S.off);
 for(let d=pd(from);d<ex;d=add(d,1)){const s=iso(d),w=d.getDay();let c=w===6?2:w===0?(S.sundays?1:0):1;
  if(off.has(s)||iso(add(d,1))===S.exam)c=0;out.push([s,c])}return out}
function mockDays(){const ex=pd(S.exam);return[iso(add(ex,-14)),iso(add(ex,-7))]}
function plan(ignoreDone){const from=ignoreDone?S.start:(todayS()>S.start?todayS():S.start);
 const map={},sl=slots(from),md=mockDays();
 const isDone=t=>!ignoreDone&&S.done[t.id];
 DATA.mocks.forEach((m,i)=>{if(!isDone(m))map[m.id]=md[i]<from?from:md[i]});
 const q=P12.filter(t=>!isDone(t));let i=0,over=0;
 for(const[s,c]of sl){let cap=md.includes(s)?0:c;while(cap>0&&i<q.length){map[q[i].id]=s;i++;cap--}
  if(i>=q.length&&cap>0){/* leftover capacity goes to revision */}
 }
 over=q.length-i;
 // revision fills remaining capacity after the last phase 1/2 task
 const lastP=q.length&&map[q[q.length-1].id]||from;const r=DATA.p3.filter(t=>!isDone(t));let k=0;
 const used={};Object.values(map).forEach(s=>used[s]=(used[s]||0)+1);
 for(const[s,c]of sl){if(s<lastP)continue;let cap=(md.includes(s)?0:c)-(used[s]||0);while(cap>0&&k<r.length){map[r[k].id]=s;k++;cap--}}
 return{map,over,rev:k}}
let PL,BASE;
function replan(){PL=plan(false);BASE=plan(true)}

/* ---------- header ---------- */
function bookPct(b){const ts=DATA.p1.filter(t=>t.book===b);const tot=ts.reduce((a,t)=>a+t.b-t.a+1,0),dn=ts.filter(t=>S.done[t.id]).reduce((a,t)=>a+t.b-t.a+1,0);return tot?Math.round(dn/tot*100):0}
function header(){$("#shelf").innerHTML=BK.map(b=>{const p=bookPct(b);return`<div class="spine" title="${esc(B[b].title)}"><div class="fill" style="height:${p}%"></div><div class="nm">${esc(short[b])}</div><div class="pc">${p}%</div></div>`}).join("");
 const days=Math.max(0,Math.round((pd(S.exam)-pd(todayS()))/864e5));const dn=ALL.filter(t=>S.done[t.id]).length,tot=dn+Object.keys(PL.map).length;
 $("#count").innerHTML=`<div><b>${days}</b>days to the exam</div><div><b>${dn}/${tot}</b>sessions done</div><div><b>${S.cards.length}</b>quote cards</div>`;
 $("#sub").textContent=`Exam: ${fmt(S.exam,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}. Change it in Plan if the date is different.`}

const kindName={read:"Read",review:"Recall and write",essay:"Essay",revise:"Revise",weak:"Weak spots",mock:"Mock exam"};
const mins={read:"35–45 min",review:"40 min",essay:"30 min",revise:"30 min",weak:"30 min",mock:"2 h 15 min"};
function edPages(t){const l=S.lang;if(l==="en"||!t.book||!t.a||!hasEd(t.book,l))return"";return` (${LN[l]} book pp. ${pageAt(t.book,l,secAt(t.book,"en",t.a))}–${pageAt(t.book,l,secAt(t.book,"en",t.b))})`}
function steps(t){if(t.kind==="read")return`<p>Read pp. ${t.a}–${t.b}${edPages(t)}. Mark facts, quotes, reasons and lessons as you go. Then close the book, write a 3 to 5 line summary from memory, and make a quote card for every important line someone says.</p>${t.items.length>1?`<p class="note">${t.items.map(esc).join(" · ")}</p>`:""}`;
 return`<p>${esc(t.drill)}</p>`}
function taskHTML(t,date){const d=S.done[t.id];const b=t.book?`<span class="tag">${esc(short[t.book])}</span>`:"";
 return`<div class="task ${d?"done":""}"><div class="meta"><span class="tag">${kindName[t.kind]}</span>${b}<span>${mins[t.kind]}</span>${date?`<span>${fmt(date)}</span>`:""}</div>
 <h3>${esc(t.kind==="read"?t.title:t.title)}</h3>${steps(t)}
 <div class="row">${t.book&&t.a?`<button class="btn" data-open="${t.book}" data-pg="${t.a}">Open book at p. ${t.a}</button>`:""}
 <button class="btn ${d?"":"pri"}" data-done="${t.id}">${d?"Done ✓ (undo)":"Mark done"}</button></div></div>`}

/* ---------- today ---------- */
function today(){const td=todayS(),m=PL.map;const ids=Object.keys(m).filter(id=>m[id]===td);
 const behind=P12.filter(t=>!S.done[t.id]&&BASE.map[t.id]<td).length;
 const ahead=P12.filter(t=>S.done[t.id]&&BASE.map[t.id]>td).length;
 const baseRev=DATA.p3.filter(t=>BASE.map[t.id]).length;
 let ban;
 if(PL.over>0)ban=`<div class="banner bad"><b>${PL.over} session${PL.over>1?"s":""} won't fit before the exam.</b> Turn on Sunday catch-ups in Plan, or do two sessions on your next free evening.</div>`;
 else if(behind>0)ban=`<div class="banner"><b>${behind} session${behind>1?"s":""} behind the original plan.</b> Everything has moved forward for you. You still have ${PL.rev} of ${baseRev} revision sessions before the exam${S.sundays?"":", and every Sunday is a free catch-up day"}.</div>`;
 else ban=`<div class="banner good"><b>${ahead?`${ahead} session${ahead>1?"s":""} ahead. Nice.`:"On track."}</b> Missed a day? Just carry on. The plan moves itself and Sundays are spare.</div>`;
 const next=Object.keys(m).filter(id=>m[id]>td).sort((a,b)=>m[a]<m[b]?-1:1).slice(0,3);
 const due=S.cards.filter(c=>(c.due||"")<=td).length;
 const dow=pd(td).getDay();
 let h=ban+`<h2>${fmt(td,{weekday:"long",month:"long",day:"numeric"})}</h2>`;
 if(td<S.start)h+=`<p>Your plan starts ${fmt(S.start)}. Here is the first session if you want a head start.</p>`;
 if(ids.length)h+=ids.map(id=>taskHTML(byId[id])).join("");
 else if(td>=S.start)h+=`<div class="task"><h3>${dow===0?"Catch-up day":"Free day"}</h3><p>Nothing is scheduled. Rest, or get ahead with the next session below.</p></div>`;
 if(due)h+=`<div class="task"><h3>${due} quote card${due>1?"s":""} due</h3><p>Five minutes of recall keeps the "who said it" marks safe.</p><div class="row"><button class="btn pri" data-goto="cards">Review cards</button></div></div>`;
 h+=`<h2>Coming up</h2>`+next.map(id=>taskHTML(byId[id],m[id])).join("");
 $("#today").innerHTML=h}

function planView(){const m=PL.map,td=todayS();const doneDates={};Object.entries(S.done).forEach(([id,d])=>{(doneDates[d]=doneDates[d]||[]).push(id)});
 const days={};Object.entries(m).forEach(([id,d])=>(days[d]=days[d]||[]).push(id));Object.entries(doneDates).forEach(([d,ids])=>ids.forEach(id=>(days[d]=days[d]||[]).push(id)));
 const off=new Set(S.off);
 let h=`<div class="set"><span>Exam date</span><input type="date" id="exD" value="${S.exam}"></div>
 <div class="set"><span>Plan start</span><input type="date" id="stD" value="${S.start}"></div>

 <div class="set"><label for="exL2" style="margin:0">Exam language</label><select id="exL2" class="exl" style="width:auto">${LANGS.map(l=>`<option value="${l}" ${S.lang===l?"selected":""}>${LN[l]}</option>`).join("")}</select></div>
 <div class="task"><h3>Backup and move progress</h3><p class="note">Progress saves on this device only. To move it, save a backup here and restore it on the other device. Last backup: ${S.lastBackup?fmt(S.lastBackup):"never"}.</p><div class="row"><button class="btn pri sm" data-bk="file">Save backup file</button><button class="btn sm" data-bk="copy">Copy backup</button><button class="btn sm" data-bk="restore">Restore</button></div><div id="bkMsg" class="note" role="status"></div></div>
 <p class="note">Weekdays have one session, Saturdays two, Sundays and holidays are spare. Busy on a day? Tap its date to mark it off and the plan shifts. Phase 1 reads everything once, phase 2 recalls and writes, phase 3 revises and runs two timed mocks.</p>`;
 const ex=pd(S.exam),st0=[S.start,...Object.values(S.done)].sort()[0];let d=pd(st0);while(d.getDay()!==1)d=add(d,-1);let ph=0;
 for(;d<ex;d=add(d,7)){let wk=`<div class="week"><h3>Week of ${fmt(iso(d),{month:"short",day:"numeric"})}</h3>`,any=false;
  for(let i=0;i<7;i++){const s=iso(add(d,i));if(s<st0||s>=S.exam)continue;const ids=(days[s]||[]).sort((a,b)=>ALL.indexOf(byId[a])-ALL.indexOf(byId[b]));
   const p=ids.map(id=>byId[id].ph).reduce((a,b)=>Math.max(a,b),0);

   if(h>0&&it.str.trim()){const n=it.str.length;fontChars[it.fontName]=(fontChars[it.fontName]||0)+n;const k=Math.round(h*2)/2;hChars[k]=(hChars[k]||0)+n}}

   l.x0=vis.length?vis[0].x:0;l.x1=vis.length?Math.max(...vis.map(i=>i.x+i.w)):0;
   // dominant height by chars
   const hc={};vis.forEach(i=>{hc[i.h]=(hc[i.h]||0)+i.s.length});l.h=+(Object.entries(hc).sort((a,b)=>b[1]-a[1])[0]||[body])[0];

  P.bf=[...fs].sort((a,b)=>(fontChars[b]||0)-(fontChars[a]||0))[0]}

let TTS=null,TTSbad=false;const SP={on:false,q:[],i:0,gen:0,cur:null};
function voiceList(){const out=[];if(TTS&&!TTSbad)out.push({id:"claude",name:"Claude voice (AI)"});
 const vs=(window.speechSynthesis&&speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
 const rank=v=>(/en-IN/i.test(v.lang)?0:/en-GB/i.test(v.lang)?1:2)-(/enhanced|premium|natural|neural|siri/i.test(v.name)?3:0);
 vs.sort((a,c)=>rank(a)-rank(c)).forEach(v=>out.push({id:v.voiceURI,name:`${v.name} (${v.lang})`}));
 if(!out.length)out.push({id:"",name:"Default voice"});return out}
function curVoiceId(){const r=RS(),vs=voiceList();return vs.some(v=>v.id===r.voice)?r.voice:vs[0].id}
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
function sentences(b){const x=b.x,out=[],re=/[^.!?…]+(?:[.!?…]+["”’)\]]*|$)\s*/g;let m;
 while((m=re.exec(x))){if(!m[0])break;let s=m.index,e=m.index+m[0].length;while(e>s&&/\s/.test(x[e-1]))e--;if(e-s>1)out.push({bid:b.id,s,e,t:x.slice(s,e)});if(re.lastIndex>=x.length)break}
 for(let k=out.length-2;k>=0;k--)if(out[k].t.length<=4){out[k].e=out[k+1].e;out[k].t=x.slice(out[k].s,out[k].e);out.splice(k+1,1)}
 return out}
function buildQueue(fromBid){const i0=T.idx[fromBid]?T.idx[fromBid]._i:0;const q=[];
 for(let i=i0;i<T.blocks.length&&q.length<400;i++){const b=T.blocks[i];if(["cap","hr","fn"].includes(b.k))continue;q.push(...sentences(b))}return q}
$("#rSpeak").onclick=()=>{if(SP.on||!$("#player").hidden){stopSpeech();return}startSpeech()};
function startSpeech(){if(!T)return;const bid=R.bid||T.blocks[0].id;SP.q=buildQueue(bid);SP.i=0;SP.on=true;SP.gen++;

function playerUI(){const r=RS().rate||1;$("#player").firstElementChild.innerHTML=`<button id="pPrev" aria-label="Previous sentence">⏮</button><button class="pp" id="pPlay" aria-label="${SP.on?"Pause":"Play"}">${SP.on?"❚❚":"▶"}</button><button id="pNext" aria-label="Next sentence">⏭</button><button class="rt" id="pRate" aria-label="Reading speed">${r}×</button><span class="who">${curVoiceId()==="claude"?"Claude voice":"Phone voice"}</span><button id="pX" aria-label="Stop reading">✕</button>`;
 $("#pPrev").onclick=()=>speakAt(Math.max(0,SP.i-1));$("#pNext").onclick=()=>speakAt(Math.min(SP.q.length-1,SP.i+1));
 $("#pPlay").onclick=()=>{if(SP.on){pauseSpeech()}else{SP.on=true;playerUI();speakAt(SP.i)}};
 $("#pRate").onclick=()=>{const R5=[.85,1,1.15,1.3,1.5];const r=RS();r.rate=R5[(R5.indexOf(r.rate||1)+1)%R5.length];save();playerUI();if(SP.on)speakAt(SP.i)};
 $("#pX").onclick=stopSpeech}
function markSpk(item){if(SP.cur&&SP.cur!==item.bid)rerender(SP.cur);SP.cur=item.bid;rerender(item.bid,[item.s,item.e]);
 const el=blockEl(item.bid),sp=el&&el.querySelector(".spk");const box=$("#flow").getBoundingClientRect(),r=(sp||el).getBoundingClientRect();
 if(r.top<box.top+20||r.bottom>box.bottom-140)(sp||el).scrollIntoView({block:"center",behavior:"smooth"})}
function speakAt(i){if(!SP.q.length)return;SP.i=i;const g=++SP.gen;const item=SP.q[i];if(!item){stopSpeech();return}markSpk(item);
 const r=RS().rate||1,vid=curVoiceId();
 if(vid==="claude"&&TTS&&!TTSbad){const lines=SP.q.slice(i,i+10).map((x,k)=>({text:x.t,id:String(i+k)}));
  try{TTS.stop()}catch(e){}
  TTS.speak(lines,{rate:r}).then(()=>{if(g!==SP.gen||!SP.on)return;const n=i+lines.length;if(n<SP.q.length)speakAt(n);else{if(extendQueue())speakAt(n);else stopSpeech()}}).catch(e=>{if(g!==SP.gen)return;if(e&&/stop/.test(e.code||"")){stopSpeech();return}TTSbad=true;speakAt(i)});return}
 const u=new SpeechSynthesisUtterance(item.t);u.rate=r;const v=(speechSynthesis.getVoices()||[]).find(x=>x.voiceURI===vid);try{if(v){u.voice=v;u.lang=v.lang}else u.lang="en-IN"}catch(e){}
 u.onend=()=>{if(g!==SP.gen||!SP.on)return;if(i+1>=SP.q.length&&!extendQueue()){stopSpeech();return}speakAt(i+1)};
 u.onerror=e=>{if(g!==SP.gen)return;if(e.error!=="interrupted"&&e.error!=="canceled"){stopSpeech();toast("Read-aloud couldn't start here. Try another voice under Aa.")}};
 if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>{if(g===SP.gen)speechSynthesis.speak(u)},60)}else speechSynthesis.speak(u)}
function extendQueue(){const last=SP.q[SP.q.length-1];if(!last)return false;const i0=T.idx[last.bid]._i+1;if(i0>=T.blocks.length)return false;
 const more=buildQueue(T.blocks[i0].id);SP.q.push(...more);return more.length>0}
function pauseSpeech(){SP.on=false;SP.gen++;try{speechSynthesis.cancel()}catch(e){}try{TTS&&TTS.stop()}catch(e){}playerUI()}
function stopSpeech(){SP.on=false;SP.gen++;try{speechSynthesis.cancel()}catch(e){}try{TTS&&TTS.stop()}catch(e){}
 if(SP.cur){const c=SP.cur;SP.cur=null;rerender(c)}$("#player").hidden=true;$("#rSpeak").setAttribute("aria-pressed","false")}
function bindTTS(t){TTS=t;try{t.onLine(({id})=>{const i=+id;if(SP.on&&SP.q[i]){SP.i=i;markSpk(SP.q[i])}})}catch(e){}}

 const box=$("#cpg");const W=Math.min(cmp.clientWidth-16,760),dpr=Math.min(2,window.devicePixelRatio||1);
 for(const p of pages){if(C.sec!==s||C.key!==keyOf(b,C.l))return;const pn=p+off;if(pn<1||pn>d.numPages)continue;
  try{const pg=await d.getPage(pn);const vp1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:W*dpr/vp1.width});

   await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}catch(e){}}}
