<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satsang Prep">
<meta name="theme-color" content="#7a1f33">
<link rel="manifest" href="manifest.json">

<title>Satsang Parichay Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, devotional, disciplined: a study companion, not a game.
   IDEA: a mandir study shelf: four textbooks as spines that fill as you read.
   PICTURE: the shelf of four spines in the maroon band, filling with saffron.
   COLOUR and TYPE: maroon field, saffron accent, white page; Mukta throughout.
   LAYOUT: one column for phones; tabs under the band; reader is full screen. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#160e11);--ink:light-dark(#24161a,#f2e8ea);--mute:light-dark(#6f5a60,#b9a5aa);
--band:light-dark(#7a1f33,#4a1321);--bandink:#fff4ee;--sa:light-dark(#e57a12,#ff9b3d);--sa2:light-dark(#fff1e3,#3a2214);
--panel:light-dark(#f7eff1,#22161a);--line:light-dark(#e8dadd,#3a2a2f);--ok:light-dark(#2f6b3a,#7fcf8d);--warn:light-dark(#a3301b,#ff8a72)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Mukta,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sa);outline-offset:2px}
.band{background:var(--band);color:var(--bandink);padding:calc(22px + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 18px max(5vw,16px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--band);z-index:30}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(26px,6vw,38px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.sub{opacity:.85;margin:6px 0 0;font-size:16px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px;align-items:end}
.spine{position:relative;height:132px;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);overflow:hidden;box-shadow:inset -6px 0 0 rgba(0,0,0,.15)}
.spine .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffb15c,var(--sa));transition:height .6s}
.spine .nm{position:absolute;inset:8px 6px auto;font-size:13px;overflow-wrap:anywhere;hyphens:auto;font-weight:600;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.spine .pc{position:absolute;bottom:6px;left:6px;font-size:13px;font-weight:800}
.spine:nth-child(2){height:110px}.spine:nth-child(3){height:120px}.spine:nth-child(4){height:126px}
.count{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;opacity:.92}
.count b{font-size:22px;display:block;line-height:1}
nav{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex}
nav button{flex:1;border:0;background:none;padding:12px 4px;min-height:48px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--sa)}
main{padding:18px max(5vw,16px) calc(80px + env(safe-area-inset-bottom))}
section[hidden]{display:none}
h2{font-size:24px;line-height:1.1;margin:22px 0 10px}
h3{font-size:17px;margin:0}
.note{font-size:14px;color:var(--mute)}
.banner{border-radius:12px;padding:12px 14px;background:var(--sa2);margin-bottom:14px}
.banner.bad{background:light-dark(#fde8e3,#3b1a14);color:var(--warn)}
.banner.good{background:light-dark(#e8f4ea,#16281a);color:var(--ok)}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--bg)}
.task.done{opacity:.6}
.task .meta{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--panel);border-radius:99px;padding:1px 9px;white-space:nowrap}
.task p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn.pri{background:var(--sa);border-color:var(--sa);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.week{margin:18px 0}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.day .d{font-weight:800;line-height:1.1;font-size:14px}
.day .d small{display:block;font-weight:400;color:var(--mute)}
.day.today .d{color:var(--sa)}
.day.off .d{color:var(--mute)}
.li{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:2px 0}
.li input{width:20px;height:20px;margin-top:3px;accent-color:var(--sa);flex:none}
.li.x span{text-decoration:line-through;color:var(--mute)}
.ph{background:var(--band);color:var(--bandink);border-radius:10px;padding:8px 12px;margin-top:20px;font-weight:600}
.book{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.cov{height:70px;border-radius:4px;background:var(--band);position:relative;overflow:hidden}
.cov i{position:absolute;bottom:0;left:0;right:0;background:var(--sa)}
.bm{font-size:14px;margin:4px 0;display:flex;gap:6px;align-items:center}
.bm button{border:0;background:none;color:var(--sa);font-weight:600;padding:4px 0;text-align:left}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;min-height:44px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:80px}
.card{border-radius:16px;background:var(--panel);padding:20px;margin:12px 0;min-height:170px}
.card q{font-size:20px;line-height:1.35;display:block}
.ans{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.set{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.set input[type=date]{width:auto}
.tog{width:22px;height:22px;accent-color:var(--sa)}
/* reader */
#reader{position:fixed;inset:0;z-index:20;background:light-dark(#e9e1e3,#0c0809);display:flex;flex-direction:column}
#reader[hidden]{display:none}
.rbar{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--band);color:var(--bandink)}
.rbar button{background:none;border:0;color:inherit;min-width:44px;min-height:44px;font-size:18px;border-radius:8px}
.rbar .t{flex:1;font-size:14px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.pg{margin:0 auto 8px;background:#fff;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pg canvas{width:100%;height:100%;display:block}
.pg .n{position:absolute;right:6px;bottom:4px;font-size:11px;color:#999}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:70%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.25);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#sheet[hidden]{display:none}
.toc button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;min-height:44px}
.toc small{color:var(--mute);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.spine .fill{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
<h1>Satsang Parichay prep</h1>
<p class="sub" id="sub">Your plan, your books and your quote cards in one place.</p>
<div class="shelf" id="shelf" aria-label="Reading progress by book"></div>
<div class="count" id="count"></div>
</div></header>
<nav><div class="wrap" role="tablist">
<button role="tab" data-t="today" aria-selected="true">Today</button>
<button role="tab" data-t="plan" aria-selected="false">Plan</button>
<button role="tab" data-t="books" aria-selected="false">Books</button>
<button role="tab" data-t="cards" aria-selected="false">Cards</button>
</div></nav>
<main><div class="wrap">
<section id="today"></section>
<section id="plan" hidden></section>
<section id="books" hidden></section>
<section id="cards" hidden></section>
</div></main>

<div id="reader" hidden>
<div class="rbar">
<button id="rClose" aria-label="Close reader">✕</button>
<div class="t"><b id="rTitle"></b><br><span id="rPage"></span></div>
<button id="rMark" aria-label="Bookmark this page">☆</button>
<button id="rOut" aria-label="Zoom out">−</button>
<button id="rIn" aria-label="Zoom in">+</button>
<button id="rToc" aria-label="Contents and bookmarks">☰</button>
</div>
<div id="pages"></div>
<div id="sheet" hidden></div>
</div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>

/* ---------- reader ---------- */
let R={b:null,doc:null,zoom:1,cur:1,obs:null,vis:null,ratio:1.4,saveT:null};
async function loadPdfLib(){if(window.pdfjsLib)return window.pdfjsLib;for(let i=0;i<50&&!window.pdfjsLib;i++)await new Promise(r=>setTimeout(r,100));return window.pdfjsLib||null}
async function openReader(b,page){const lib=await loadPdfLib();const blob=await pdfGet(b);
 if(!lib||!blob){alertBox("The reader couldn't load. Check your connection and try again.");return}
 $("#reader").hidden=false;$("#rTitle").textContent=B[b].title;$("#pages").innerHTML=`<p style="text-align:center;padding:30px">Opening…</p>`;document.body.style.overflow="hidden";
 try{const buf=await blob.arrayBuffer();if(R.doc&&R.b!==b){R.doc.destroy();R.doc=null}
  if(!R.doc){R.doc=await lib.getDocument({data:buf}).promise;R.b=b}
  const p1=await R.doc.getPage(Math.min(R.doc.numPages,3));const vp=p1.getViewport({scale:1});R.ratio=vp.height/vp.width;
  layout();goPage(page||S.last[b]||1)}catch(err){$("#pages").innerHTML=`<p style="padding:30px">This file couldn't be opened as a PDF.</p>`}}
function alertBox(msg){$("#today").insertAdjacentHTML("afterbegin",`<div class="banner bad">${esc(msg)}</div>`)}
function layout(){const box=$("#pages"),W=Math.min(box.clientWidth-16,900)*R.zoom;let h="";
 for(let i=1;i<=R.doc.numPages;i++)h+=`<div class="pg" data-p="${i}" style="width:${W}px;height:${Math.round(W*R.ratio)}px"><span class="n">${i}</span></div>`;
 box.innerHTML=h;R.obs&&R.obs.disconnect();R.vis&&R.vis.disconnect();
 R.obs=new IntersectionObserver(es=>es.forEach(x=>{const el=x.target;if(x.isIntersecting)draw(el);else if(el.firstChild&&el.firstChild.tagName==="CANVAS"&&Math.abs(+el.dataset.p-R.cur)>4)el.querySelector("canvas").remove()}),{root:box,rootMargin:"150% 0px"});
 R.vis=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting&&x.intersectionRatio>.4){R.cur=+x.target.dataset.p;status()}})},{root:box,threshold:[.4,.7]});
 box.querySelectorAll(".pg").forEach(el=>{R.obs.observe(el);R.vis.observe(el)})}
async function draw(el){if(el.querySelector("canvas")||el.dataset.busy)return;el.dataset.busy=1;
 try{const pg=await R.doc.getPage(+el.dataset.p);const W=el.clientWidth,dpr=Math.min(2,window.devicePixelRatio||1);const vp=pg.getViewport({scale:W*dpr/pg.getViewport({scale:1}).width});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;el.prepend(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}catch(e){}

$("#rMark").onclick=()=>{const l=S.bm[R.b]=S.bm[R.b]||[];const i=l.findIndex(x=>x.p===R.cur);
 if(i>=0){l.splice(i,1);save();status()}else{sheet(`<h3>Bookmark PDF page ${R.cur}</h3><label for="bmn">Note (optional)</label><input type="text" id="bmn" placeholder="e.g. Raiba fills the bowls"><div class="row"><button class="btn pri" id="bmS">Save bookmark</button><button class="btn" id="shX">Cancel</button></div>`);
  $("#bmS").onclick=()=>{l.push({p:R.cur,note:$("#bmn").value.trim(),t:Date.now()});save();$("#sheet").hidden=true;status()}}};
function sheet(h){const s=$("#sheet");s.innerHTML=h;s.hidden=false;const x=$("#shX");if(x)x.onclick=()=>s.hidden=true}
$("#rToc").onclick=()=>{const b=R.b,off=S.adj[b]??B[b].offset;const bm=(S.bm[b]||[]).slice().sort((a,c)=>a.p-c.p);
 sheet(`<div class="row" style="margin:0 0 8px;justify-content:space-between"><h3>Contents</h3><button class="btn sm" id="shX">Close</button></div>
 ${bm.length?`<div class="toc">${bm.map(x=>`<button data-go="${x.p}"><span>★ ${esc(x.note||"Bookmark")}</span><small>PDF p. ${x.p}</small></button>`).join("")}</div>`:""}
 <div class="toc">${B[b].ch.map(([c,t,p])=>`<button data-go="${p+off}"><span>${b==="sc"?`Ch ${c} · `:`${c}. `}${esc(t)}</span><small>p. ${p}</small></button>`).join("")}</div>
 <h3 style="margin-top:16px">Page numbers off?</h3><p class="note">Type the number printed on the page you're looking at now (PDF page ${R.cur}).</p>
 <div class="row"><input type="text" inputmode="numeric" id="fixN" style="width:120px" aria-label="Printed page number"><button class="btn" id="fixB">Fix</button></div>`);
 $("#sheet").querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{$("#sheet").hidden=true;goPage(+x.dataset.go)});
 $("#fixB").onclick=()=>{const n=parseInt($("#fixN").value,10);if(n>0){S.adj[b]=R.cur-n;save();$("#sheet").hidden=true;status()}}};
let rT;window.addEventListener("resize",()=>{if($("#reader").hidden||!R.doc)return;clearTimeout(rT);rT=setTimeout(()=>{const p=R.cur;layout();goPage(p)},300)});

/* ---------- boot ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();try{const t=sessionStorage.getItem("spp-tab");if(t)tab(t)}catch(e){}
idb().then(async d=>{pdfStore=d;for(const b of BK)have[b]=!!(await pdfGet(b));booksView()});
setInterval(()=>{if(document.hidden)return;const t=todayS();if(t!==window._d){window._d=t;render()}},60000);window._d=todayS();
(async()=>{try{if(!window.claude||!claude.use)return;db=await claude.use("db");const user=await claude.use("user");const id=user&&await user.id();
 if(!db||!id)return;ref=db.collection("data/users/"+id).doc("state");
 const snap=await ref.get();if(snap.exists){const r=snap.data();if(r&&r.v===1&&(r.upd||0)>(S.upd||0)){S=fixExam(Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(JSON.stringify(r))));try{localStorage.setItem("spp-state",JSON.stringify(S))}catch(e){}render()}else if((S.upd||0)>(r.upd||0))push()}else if(S.upd)push();
 ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const r=s.data();if(r&&r.v===1&&(r.upd||0)>(S.upd||0)){S=fixExam(Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(JSON.stringify(r))));try{localStorage.setItem("spp-state",JSON.stringify(S))}catch(e){}if($("#reader").hidden)render()}},()=>{});
}catch(e){}})();
}
</script>
